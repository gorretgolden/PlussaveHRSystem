<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlusSave HR System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* base reset (added for local viewing) */
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: fixed deep-green navigation rail + scrolling workspace; every menu opens with a brand strip carrying the PlusSave and PlusPay logos, then the page title and its actions. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#edf2ef; --line:#d9e3de; --line-2:#c6d3cc;
  --ink:#12241c; --muted:#56675f; --faint:#86968e;
  --brand:#0b5a3a; --brand-ink:#ffffff; --brand-soft:#e1efe8; --brand-strong:#06402a;
  --accent:#b9821a; --accent-soft:#f8eed9;
  --ok:#1c7447; --ok-soft:#e0f2e8; --warn:#9a5d00; --warn-soft:#fbeed8;
  --crit:#b3261e; --crit-soft:#fce6e3; --info:#22579a; --info-soft:#e3ecf8;
  --side-bg:#093523; --side-ink:#d7e8df; --side-muted:#8db2a0; --side-active:#11553a; --side-line:#14472f;
  --bar:#1b7650; --bar-track:#e6eeea;
  --shadow:0 1px 2px rgba(9,40,27,.06),0 6px 20px rgba(9,40,27,.07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1411; --surface:#131d19; --surface-2:#18241f; --line:#24342d; --line-2:#30443b;
  --ink:#e3ede8; --muted:#9bb0a6; --faint:#6d8378;
  --brand:#3aa874; --brand-ink:#04140c; --brand-soft:#16301f; --brand-strong:#86d6ad;
  --accent:#dfa944; --accent-soft:#33270f;
  --ok:#4fc58c; --ok-soft:#12301f; --warn:#e9a640; --warn-soft:#33250e;
  --crit:#f17c6d; --crit-soft:#3a1713; --info:#86b3f1; --info-soft:#15243a;
  --side-bg:#07110d; --side-ink:#cfe1d7; --side-muted:#7c988b; --side-active:#153a29; --side-line:#122219;
  --bar:#47b583; --bar-track:#1d2c25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1411; --surface:#131d19; --surface-2:#18241f; --line:#24342d; --line-2:#30443b;
  --ink:#e3ede8; --muted:#9bb0a6; --faint:#6d8378;
  --brand:#3aa874; --brand-ink:#04140c; --brand-soft:#16301f; --brand-strong:#86d6ad;
  --accent:#dfa944; --accent-soft:#33270f;
  --ok:#4fc58c; --ok-soft:#12301f; --warn:#e9a640; --warn-soft:#33250e;
  --crit:#f17c6d; --crit-soft:#3a1713; --info:#86b3f1; --info-soft:#15243a;
  --side-bg:#07110d; --side-ink:#cfe1d7; --side-muted:#7c988b; --side-active:#153a29; --side-line:#122219;
  --bar:#47b583; --bar-track:#1d2c25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);height:100%}

/* sidebar */
.side{background:var(--side-bg);color:var(--side-ink);overflow-y:auto;padding:14px 10px 24px;padding-left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;border-bottom:1px solid var(--side-line)}
.side-brand .t{font-family:var(--f-display);font-weight:650;font-size:15px;line-height:1.15;color:#fff}
.side-brand .s{font-size:11px;color:var(--side-muted);letter-spacing:.06em;text-transform:uppercase}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group h4{margin:6px 10px 4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--side-ink);padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.on{background:var(--side-active);color:#fff;font-weight:600}
.nav-item svg{width:16px;height:16px;flex:none;opacity:.85}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#1d1404;font-size:11px;font-weight:700;border-radius:20px;padding:0 7px;line-height:18px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.search input{border:0;background:none;outline:none;width:100%;min-width:0}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.seg-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.iconbtn{position:relative;background:none;border:1px solid var(--line);border-radius:9px;padding:6px 8px;cursor:pointer;display:inline-flex}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:0 5px;line-height:16px}
.me{display:flex;align-items:center;gap:8px}
.me .n{font-weight:600;font-size:13px;line-height:1.1}
.me .r{font-size:11.5px;color:var(--muted)}
.view{flex:1;overflow-y:auto;padding-block:0 48px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* brand strip + page head */
.brandstrip{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.logos{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logos .div{width:1px;height:34px;background:var(--line-2)}
.logo{display:flex;align-items:center;gap:9px}
.logo img{height:38px;width:auto;max-width:180px;object-fit:contain}
.logo .wm{display:flex;flex-direction:column;line-height:1.05}
.logo .wm b{font-family:var(--f-display);font-weight:750;font-size:17px;letter-spacing:-.015em;color:var(--brand-strong)}
.logo .wm small{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.strip-meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pagehead h1{font-size:26px;font-weight:650}
.crumbs{font-size:12px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:0}

/* pills / chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.gold{background:var(--accent-soft);color:var(--accent)} .pill.brand{background:var(--brand-soft);color:var(--brand-strong)}
.pill.plain::before{display:none}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:15px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card h3 .sub{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--brand)}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.alert{border-left:3px solid var(--warn)} .kpi.critical{border-left:3px solid var(--crit)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-soft)} .note.ok{background:var(--ok-soft)} .note.crit{background:var(--crit-soft)}
.note b{font-weight:700}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--brand-soft)}
td.r,th.r{text-align:right} tfoot td{font-weight:700;background:var(--surface-2)}
.person{display:flex;align-items:center;gap:9px;min-width:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-weight:700;font-size:11.5px;flex:none;overflow:hidden}
.av.lg{width:72px;height:72px;font-size:22px}
.av img{width:100%;height:100%;object-fit:cover}
.person .pn{font-weight:600;line-height:1.15} .person .ps{font-size:11.5px;color:var(--muted)}

/* toolbar / tabs */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--brand-strong);border-bottom-color:var(--brand)}

/* bars (single hue, magnitude) */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .lb{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:12px;background:var(--bar-track);border-radius:4px;position:relative}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0;min-width:3px}
.bar-row .vv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar-row:hover .bar-fill{filter:brightness(1.12)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;line-height:1.2}
.li .s{font-size:12px;color:var(--muted)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field label .req{color:var(--crit)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--faint)}
.field input[readonly]{background:var(--surface-2);color:var(--muted)}
.sec-title{grid-column:1/-1;font-family:var(--f-display);font-weight:650;font-size:14px;color:var(--brand-strong);padding-top:6px;border-top:1px dashed var(--line);margin-top:4px}
.sec-title:first-child{border-top:0;margin-top:0;padding-top:0}
.calc{grid-column:1/-1;background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:13px}

/* overlay: modal + drawer */
.scrim{position:fixed;inset:0;background:rgba(5,20,13,.45);z-index:40;display:flex;justify-content:flex-end}
.scrim[hidden]{display:none!important}
.drawer{background:var(--surface);width:min(620px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.modal{background:var(--surface);width:min(760px,100%);max-height:calc(100% - 20px);overflow-y:auto;border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ov-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.ov-head h2{font-size:18px}
.ov-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.ov-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:7px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}

/* maker-checker timeline */
.flow{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:0;margin:2px 0}
.step{position:relative;padding:0 6px;text-align:center;font-size:12px}
.step .dotc{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--surface-2);border:2px solid var(--line-2);color:var(--muted);position:relative;z-index:1}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line-2)}
.step:first-child::before{display:none}
.step.done .dotc{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done::before,.step.cur::before{background:var(--ok)}
.step.cur .dotc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.step.bad .dotc{background:var(--crit);border-color:var(--crit);color:#fff}
.step .sl{font-weight:600;color:var(--ink)} .step .ss{color:var(--muted);font-size:11px}
.hist{display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--line);padding-left:14px;margin-left:6px}
.hist .h{position:relative;font-size:12.5px}
.hist .h::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.hist .h.r::before{background:var(--crit)} .hist .h.w::before{background:var(--warn)}
.hist .h .w1{font-weight:600}
.hist .h .c{background:var(--surface-2);border-radius:7px;padding:6px 9px;margin-top:4px}

/* permissions (mirrors the existing back-office screen) */
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 18px}
.cb{display:flex;align-items:center;gap:9px;padding:6px 4px;font-size:12.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;border-radius:6px}
.cb:hover{background:var(--surface-2)}
.cb input{width:17px;height:17px;accent-color:var(--brand);flex:none}
.cb.lc{text-transform:none;font-weight:500;letter-spacing:0;font-size:13px}
.perm-mod{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.perm-mod h5{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-strong)}

.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;font-weight:600;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:min(420px,calc(100% - 32px))}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.stage-card{display:flex;gap:10px;align-items:center;padding:10px;border:1px dashed var(--line-2);border-radius:8px;font-size:12.5px}
.arrow{color:var(--faint)}
.sysbox{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--surface)}
.sysbox .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.sysbox ul{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px}
.check{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px}
.check input{accent-color:var(--brand);width:16px;height:16px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:50;transform:translateX(-105%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .burger{display:inline-flex}
  .me .txt{display:none}
}
@media (max-width:640px){
  .g2,.g3,.g4,.form{grid-template-columns:minmax(0,1fr)}
  .pagehead h1{font-size:22px}

/* ================= PAYROLL ENGINE ================= */
function payeOf(c) {
  let t = 0, prev = 0;
  for (const [cap, rate] of CONFIG.paye) { if (c > prev) t += (Math.min(c, cap) - prev) * rate; prev = cap; }
  if (c > CONFIG.surtaxOver) t += (c - CONFIG.surtaxOver) * CONFIG.surtax;
  return Math.round(t);
}
function lstAnnual(m) { for (const [cap, amt] of CONFIG.lst) if (m <= cap) return amt; return 0; }
const allw = e => { const g = GRADES[e.grade]; return e.type === 'Part-time' ? {tr:g.tr, hs:0, at:g.at} : {tr:g.tr, hs:g.hs, at:g.at}; };
function payLine(e, inputs, period) {
  const month = +period.slice(5, 7); const a = allw(e);
  let f = 1, final = false;
  const ex = EXITS.find(x => x.emp === e.id);
  if (ex && ex.lwd && ex.lwd.slice(0, 7) === period) { const dim = new Date(+period.slice(0,4), month, 0).getDate(); f = +ex.lwd.slice(8, 10) / dim; final = true; }
  const basic = Math.round(e.basic * f), allowances = Math.round((a.tr + a.hs + a.at) * f);
  const mine = inputs.filter(i => i.emp === e.id);
  const extra = mine.filter(i => i.kind !== 'Deduction').reduce((s, i) => s + i.amt, 0);
  const otherDed = mine.filter(i => i.kind === 'Deduction').reduce((s, i) => s + i.amt, 0);
  const gross = basic + allowances + extra;
  const lst = CONFIG.lstMonths.includes(month) && !final ? Math.round(lstAnnual(e.basic + a.tr + a.hs + a.at) / CONFIG.lstMonths.length) : 0;
  const chargeable = gross - (CONFIG.lstDeductible ? lst : 0);
  const paye = payeOf(chargeable);
  const nssfEe = Math.round(gross * CONFIG.nssfEe), nssfEr = Math.round(gross * CONFIG.nssfEr);
  const loan = final ? 0 : e.loan, sav = final ? 0 : e.sav;
  const ded = paye + nssfEe + lst + loan + sav + otherDed;
  return {e, basic, allowances, extra, gross, chargeable, paye, nssfEe, nssfEr, lst, loan, sav, otherDed, ded, net:gross - ded, final};
}
function payRegister(period = PAY.period) {
  const people = EMP.filter(e => !['Resigned','Terminated'].includes(e.status) || EXITS.some(x => x.emp === e.id && x.lwd && x.lwd.slice(0,7) === period));
  const lines = people.map(e => payLine(e, PAY.inputs, period));
  const tot = k => lines.reduce((s, l) => s + l[k], 0);
  return {lines, tot:{gross:tot('gross'), paye:tot('paye'), nssfEe:tot('nssfEe'), nssfEr:tot('nssfEr'), lst:tot('lst'), loan:tot('loan'), sav:tot('sav'), otherDed:tot('otherDed'), net:tot('net'), extra:tot('extra')}};
}
function gratuityFor(e, basis = CONFIG.gratuity.basis, rate) {
  const yrs = Math.floor(tenure(e) * 100) / 100;
  const amt = basis === 'pct' ? e.basic * 12 * ((rate ?? CONFIG.gratuity.pct) / 100) * yrs : e.basic * (rate ?? CONFIG.gratuity.months) * yrs;
  return {yrs, amt:Math.round(amt)};
}

let RID = 1031;
function newReq({type, subject, maker, fields, payload = {}, note = '', at}) {
  const makerRole = roleOfEmp(maker);
  const chain = makerRole === 'staff' ? ['hr','md'] : makerRole === 'hr' ? ['md'] : ['hr'];
  const r = {id:'R-' + (RID++), type, subject, maker, makerRole, created:at || now(), fields, payload, chain, stage:0, status:'pending',
             hist:[{by:maker, act:'Submitted', at:at || now(), c:note}]};
  REQS.unshift(r);
  if (!at) { notify(chain[0], `${r.id} ${type}: ${subject} is waiting for your ${chain[0]==='hr'?'review':'approval'}`); audit('Submitted', r.id, `${type}: ${subject}`); }
  return r;
}
const stageRole = r => r.status === 'pending' ? r.chain[r.stage] : null;
const isMine = (r, role = S.role) => r.maker === USERS[role].emp;
const canAct = (r, role = S.role) => stageRole(r) === role && !isMine(r, role);
const awaiting = (role = S.role) => REQS.filter(r => canAct(r, role));
function act(r, action, c) {
  const by = USERS[S.role].emp;
  if (!canAct(r)) { toast('You cannot act on this request at its current stage.'); return; }
  if ((action === 'reject' || action === 'return') && !c.trim()) { toast('Add a comment so the maker knows what to fix.'); return false; }
  if (action === 'forward') {
    r.hist.push({by, act:`Verified by ${ROLE_NAME[S.role]}, forwarded to MD`, at:now(), c}); r.stage++;
    notify('md', `${r.id} ${r.type}: ${r.subject} verified by HR, waiting for your approval`);
  } else if (action === 'approve') {
    r.hist.push({by, act:`Approved by ${ROLE_NAME[S.role]}`, at:now(), c}); r.status = 'approved';
    (EFFECTS[r.type] || (() => {}))(r);
    notify(r.maker, `${r.id} ${r.type} was approved`); if (r.makerRole === 'staff') notify('hr', `${r.id} ${r.type} for ${nm(emp(r.maker))} approved by MD`);
  } else if (action === 'return') {
    if (S.role === 'md' && r.chain[0] === 'hr' && r.stage > 0) { r.stage = 0; r.hist.push({by, act:'Returned to HR by MD', at:now(), c, k:'w'}); notify('hr', `${r.id} returned to you by MD`); }
    else { r.status = 'returned'; r.hist.push({by, act:`Returned to maker by ${ROLE_NAME[S.role]}`, at:now(), c, k:'w'}); notify(r.maker, `${r.id} ${r.type} was returned for correction`); }
  } else if (action === 'reject') {
    r.status = 'rejected'; r.hist.push({by, act:`Rejected by ${ROLE_NAME[S.role]}`, at:now(), c, k:'r'}); notify(r.maker, `${r.id} ${r.type} was rejected`);
    if (r.type === 'Monthly payroll') PAY.status = 'Draft';

  audit({forward:'Verified and forwarded', approve:'Approved', return:'Returned', reject:'Rejected'}[action], r.id, `${r.type}: ${r.subject}${c ? ' | ' + c : ''}`);
  return true;
}

function fieldHtml(f) {

  else if (f.type === 'textarea') input = `<textarea id="${id}"${req}${ro}>${esc(f.val || '')}</textarea>`;
  else if (f.type === 'file') input = `<input type="file" id="${id}" ${f.multiple ? 'multiple' : ''} accept="${f.accept || ''}">`;
  else input = `<input type="${f.type || 'text'}" id="${id}" value="${esc(f.val ?? '')}"${req}${ro} ${f.min != null ? `min="${f.min}"` : ''}>`;

/* maker-checker visuals */
function flowHtml(r, _) {
  const chain = Array.isArray(r) ? r : null;
  const steps = chain ? chain : ['maker', ...r.chain];
  const labels = {maker:'Maker', staff:'Staff', hr:'HR review', md:'MD approval'};
  return `<div class="flow" style="--n:${steps.length + (chain ? 0 : 1)}">${steps.map((s, i) => {
    let cls = '', sub = '';
    if (!chain) {
      if (i === 0) { cls = 'done'; sub = nm(emp(r.maker)); }
      else { const si = i - 1;
        if (r.status === 'approved' || si < r.stage) cls = 'done';
        else if (si === r.stage && r.status === 'pending') { cls = 'cur'; sub = 'Waiting'; }
        else if (si === r.stage && r.status === 'rejected') { cls = 'bad'; sub = 'Rejected'; }
        else if (si === r.stage && r.status === 'returned') { cls = 'bad'; sub = 'Returned'; } }
    } else if (i === 0) cls = 'cur';
    return `<div class="step ${cls}"><div class="dotc">${cls === 'done' ? '✓' : i + 1}</div><div class="sl">${chain && i === 0 ? ROLE_NAME[s] + ' (maker)' : labels[s] || s}</div><div class="ss">${esc(sub)}</div></div>`;
  }).join('')}${chain ? '' : `<div class="step ${r.status === 'approved' ? 'done' : ''}"><div class="dotc">${r.status === 'approved' ? '✓' : steps.length + 1}</div><div class="sl">Applied</div><div class="ss">${r.status === 'approved' ? 'Record updated' : ''}</div></div>`}</div>`;
}
function reqDrawer(id) {

  let actions = '';
  if (can) actions = `<div class="field"><label for="actc">Comment ${S.role === 'hr' ? '(required to return or reject)' : '(required to return or reject)'}</label><textarea id="actc" placeholder="${S.role === 'hr' ? 'What did you verify? e.g. balance checked, reliever confirmed' : 'Approval note'}"></textarea></div>

  else if (r.status === 'returned' && mine) actions = `<div class="field"><label for="actc">What did you correct?</label><textarea id="actc" placeholder="e.g. Burial notice attached"></textarea></div><div class="field"><label for="actf">Attach document</label><input type="file" id="actf"></div><div class="actions"><button class="btn primary" data-act="resubmit" data-id="${r.id}">Resubmit</button></div>`;
  openDrawer(`${ovHead(r.type, `${r.id} · raised ${DT(r.created)}`)}<div class="ov-body">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${reqStatus(r)} ${sla(r)} <span class="chip">Maker: ${esc(nm(emp(r.maker)))} (${ROLE_NAME[r.makerRole]})</span></div>

    ${actions}</div>`);
}

function metrics() {
  const act = activeEmp(), t = ISO(TODAY);
  const onLeave = act.filter(e => e.status === 'On Leave');
  const absent = act.filter(e => !ATT[e.id] && e.status === 'Active');
  const late = act.filter(e => ATT[e.id] && ATT[e.id][0] > SHIFT_START);
  const contracts = act.filter(e => e.cEnd && fromToday(e.cEnd) <= 90).sort((a, b) => a.cEnd.localeCompare(b.cEnd));
  const probation = act.filter(e => e.type === 'Probationary' && e.pEnd && fromToday(e.pEnd) <= 45).sort((a, b) => a.pEnd.localeCompare(b.pEnd));
  const appraisal = APPRAISALS.filter(a => a.status !== 'Completed' && fromToday(a.due) <= 30).sort((a, b) => a.due.localeCompare(b.due));
  const newStaff = act.filter(e => days(e.joined, t) <= 90);
  const exits = EXITS.filter(x => days(x.lwd || x.notice, t) <= 90);
  const trainDue = TRAININGS.filter(x => x.status === 'Scheduled' && fromToday(x.date) <= 30 && fromToday(x.date) >= 0);
  const cases = CASES.filter(c => c.stage !== 'Closed');
  return {act, onLeave, absent, late, contracts, probation, appraisal, newStaff, exits, trainDue, cases};
}

/* Add employee (HR maker → MD) */

  const nextId = 'PSF-' + String(Math.max(...EMP.map(e => +e.id.slice(4))) + 1).padStart(4, '0');
  formModal({title:'Add employee', sub:'HR is the maker. The new file goes live after the MD approves.', flow:['hr','md'], fields:[
    {sec:'1. Employee file'}, {id:'id', label:'Employee ID', val:nextId, ro:1, hint:'Generated automatically'}, {id:'photo', label:'Photograph', type:'file', accept:'image/*'},
    {id:'fn', label:'First name', req:1}, {id:'ln', label:'Last name', req:1}, {id:'g', label:'Gender', type:'select', opts:[['F','Female'],['M','Male']]}, {id:'dob', label:'Date of birth', type:'date', req:1},
    {id:'nin', label:'National ID (NIN)', req:1, hint:'Stored encrypted; shown masked'}, {id:'phone', label:'Phone', req:1}, {id:'email', label:'Email'}, {id:'addr', label:'Address'},
    {id:'nokn', label:'Next of kin name', req:1}, {id:'nokp', label:'Next of kin contact', req:1},
    {sec:'2. Employee information'}, {id:'title', label:'Job title', req:1}, {id:'dept', label:'Department', type:'select', opts:DEPTS}, {id:'branch', label:'Branch', type:'select', opts:BRANCHES},
    {id:'sup', label:'Supervisor', type:'select', opts:activeEmp().filter(e => ['G1','G2','G3'].includes(e.grade)).map(e => [e.id, nm(e) + ', ' + e.title])},
    {id:'type', label:'Employment type', type:'select', opts:TYPES, val:'Probationary'}, {id:'joined', label:'Date joined / contract start', type:'date', req:1},
    {id:'pEnd', label:'Probation end', type:'date', hint:'Default 6 months from start'}, {id:'cEnd', label:'Contract end', type:'date', hint:'For contract and intern staff'},
    {id:'grade', label:'Grade', type:'select', opts:Object.entries(GRADES).map(([k, g]) => [k, k + ' · ' + g.name]), val:'G4'}, {id:'basic', label:'Basic salary (UGX)', type:'number', req:1},
    {sec:'3. Documents'}, {id:'docs', label:'CV, academic documents, appointment letter, contract, NDA, JD, ID copy', type:'file', multiple:1, full:1},
    {sec:'4. Accounts in other systems'}, {id:'sys', label:'Create on approval', type:'select', opts:['Core banking user + PlusPay login + email','Core banking user + email','Email only'], full:1, hint:'Sent to IT automatically once the MD approves'}],
    onSubmit:v => {
      const miss = ['fn','ln','dob','nin','phone','nokn','nokp','title','joined','basic'].filter(k => !v[k]); if (miss.length) return formError('Fill all required fields marked *.'), false;
      const pStart = v.type === 'Probationary' ? v.joined : null; const pEnd = v.pEnd || (pStart ? ISO(new Date(new Date(v.joined).setMonth(new Date(v.joined).getMonth() + 6))) : null);
      const e = E(v.id, v.fn, v.ln, v.g, v.dob, v.title, v.dept, v.branch, v.sup, v.type, v.joined, v.grade, +v.basic, {pStart, pEnd, cEnd:v.cEnd || null, phone:v.phone, nin:v.nin.slice(0, 3) + '••••••' + v.nin.slice(-3), addr:v.addr || '-', nok:{n:v.nokn, rel:'Next of kin', p:v.nokp}, bal:{Annual:0, Sick:30, Other:6}});

function caseCard(c) {

    <div class="flow" style="--n:${st.length}">${st.map((s, k) => `<div class="step ${k < i || c.stage === 'Closed' ? 'done' : k === i ? 'cur' : ''}"><div class="dotc">${k < i || c.stage === 'Closed' ? '✓' : k + 1}</div><div class="sl">${s}</div></div>`).join('')}</div>

    ${c.hearing ? `<dt>Hearing</dt><dd>${D(c.hearing.date)} · Panel: ${c.hearing.panel.map(x => esc(nm(emp(x)))).join(', ')}${c.hearing.minutes ? `<div class="muted">${esc(c.hearing.minutes)}</div>` : ''}</dd>` : ''}
    <dt>Decision</dt><dd>${c.decision ? `<b>${esc(c.decision)}</b>` : pend ? reqStatus(pend) : '<span class="faint">Not yet</span>'}</dd></dl>
    ${hr && c.stage !== 'Closed' && !pend && next ? `<div class="actions" style="margin-top:12px"><button class="btn primary" data-act="caseNext" data-id="${c.id}">${next}</button></div>` : ''}

function finalDues(x) { const e = emp(x.emp); const pro = x.lwd ? Math.round(e.basic * (+x.lwd.slice(8, 10)) / new Date(+x.lwd.slice(0, 4), +x.lwd.slice(5, 7), 0).getDate()) : 0;
  const lp = leavePay(e, e.bal.Annual), gr = e.type === 'Contract' ? gratuityFor(e).amt : 0; return {pro, lp, gr, total:pro + lp + gr}; }
function exitCard(x) {
  const e = emp(x.emp), items = Object.entries(x.clear), done = items.filter(i => i[1]).length, hr = S.role === 'hr', fd = finalDues(x);
  return `<section class="card"><h3><span>${x.id} · ${esc(nm(e))}</span>${pill(x.status, x.status === 'Completed' ? 'ok' : 'gold')}</h3>
  <dl class="kv"><dt>Exit type</dt><dd>${esc(x.type)}</dd><dt>Notice given</dt><dd>${D(x.notice)}</dd><dt>Last working day</dt><dd>${D(x.lwd)}</dd><dt>Reason</dt><dd>${esc(x.reason)}</dd><dt>Exit interview</dt><dd>${esc(x.interview || 'Not yet done')}</dd></dl>
  <div style="margin:12px 0 4px;display:flex;justify-content:space-between"><b>Clearance</b><span class="muted">${done} of ${items.length}</span></div>
  <div class="bar-track" style="margin-bottom:8px"><span class="bar-fill" style="width:${done / items.length * 100}%"></span></div>
  ${items.map(([k, v]) => `<label class="check"><input type="checkbox" ${v ? 'checked' : ''} ${hr && x.status !== 'Completed' ? `data-change="clr" data-id="${x.id}" data-k="${esc(k)}"` : 'disabled'}> ${esc(k)}</label>`).join('')}
  ${x.status !== 'Completed' ? `<div class="calc" style="margin-top:10px">Final dues: pro-rata salary ${N(fd.pro)} + leave pay ${N(fd.lp)} (${e.bal.Annual} days)${fd.gr ? ' + gratuity ' + N(fd.gr) : ''} = <b>${UGX(fd.total)}</b> before PAYE and NSSF. Staff loan balance is settled from core banking first.</div>` : ''}
  ${hr && x.status !== 'Completed' ? `<div class="actions" style="margin-top:12px"><button class="btn" data-act="revoke" data-id="${x.id}">Disable access in connected systems</button><button class="btn primary" data-act="dues" data-id="${x.id}">Send final dues to MD</button></div>` : ''}</section>`;
}

  body:`<div class="grid g2">${EXITS.map(exitCard).join('') || '<div class="empty">No exits recorded.</div>'}</div>`});

A.permCopy = el => { if (!el.value) return; S.permDraft.p = new Set(ROLE_PERMS[el.value].p); toast(`Copied ${ROLE_PERMS[el.value].p.length} permissions from ${el.value}`); render(); };
A.permSearch = el => { S.permQ = el.value; render(); };
A.savePerms = () => { const d = S.permDraft, old = ROLE_PERMS[d.role]; const add = [...d.p].filter(p => !old.p.includes(p)), rem = old.p.filter(p => !d.p.has(p));
  if (!add.length && !rem.length && [...d.a].sort().join() === [...old.a].sort().join()) return toast('No changes to save.');
  newReq({type:'Role permission change', subject:`${d.role}: ${add.length} added, ${rem.length} removed`, maker:USERS[S.role].emp, fields:[['Role', d.role], ['Added', add.join(', ') || 'None'], ['Removed', rem.join(', ') || 'None'], ['Privileges', [...d.a].join(', ')]], payload:{role:d.role, p:[...d.p], a:[...d.a]}}); render(); toast('Sent to the MD for approval'); };
EFFECTS['Role permission change'] = r => { ROLE_PERMS[r.payload.role] = {p:r.payload.p, a:r.payload.a}; };

/* ================= APPROVAL WORKFLOW ================= */
VIEWS.workflow = () => page({crumb:'Administration', title:'Approval workflow', sub:'Maker-checker routes for every request type.',
  body:table([{h:'Request type', f:w => `<b>${esc(w[0])}</b>`}, {h:'Maker', f:w => pill(w[1], w[1] === 'Staff' ? 'info' : 'brand')}, {h:'Checker (HR)', f:w => w[2] ? esc(w[2]) : '<span class="faint">HR is the maker</span>'}, {h:'Final approver', f:w => esc(w[3])}, {h:'Route', f:w => (w[1] === 'Staff' ? 'Staff → HR → MD' : 'HR → MD')}], WORKFLOWS)
   + `<div class="grid g2">${card('Rules every route follows', `<div class="list">${[['No self-approval','A maker can never check or approve their own request. HR\'s own requests go straight to the MD; the MD\'s own requests go to HR and are reported to the Board.'], ['Return or reject needs a reason','The comment is shown to the maker and kept in history.'], ['MD returns to HR','An MD return goes back to HR, who can fix it or send it back to staff.'], ['Time limits','HR has ' + CONFIG.sla.hr + 'h and MD ' + CONFIG.sla.md + 'h. Reminders at half time; overdue items are flagged in red on both dashboards.'], ['Delegation','When the MD is away, the MD names an acting approver with start and end dates. Every action shows "on behalf of".'], ['Audit','Every submit, verify, approve, return, reject and edit is logged with user, time, device and old and new values.']].map(([t, s]) => `<div class="li"><div class="grow"><div class="t">${t}</div><div class="s">${s}</div></div></div>`).join('')}</div>`)}
   ${card('Delegation of approval', `<div class="form"><div class="field"><label for="dg_who">Acting approver</label><select id="dg_who">${activeEmp().filter(e => ['G2'].includes(e.grade) && e.id !== USERS.hr.emp).map(e => `<option>${esc(nm(e))}, ${esc(e.title)}</option>`).join('')}</select></div><div class="field"><label for="dg_from">From</label><input type="date" id="dg_from" value="2026-11-16"></div><div class="field"><label for="dg_to">To</label><input type="date" id="dg_to" value="2026-11-20"></div><div class="field"><label for="dg_sc">Scope</label><select id="dg_sc"><option>All HR approvals except payroll</option><option>All HR approvals</option></select></div></div><div class="actions" style="margin-top:12px"><button class="btn" data-act="delegate">Save delegation</button></div>`, 'Set by the MD')}</div>`});
A.delegate = () => { audit('Set delegation', 'MD', `${$('#dg_who').value} ${$('#dg_from').value} to ${$('#dg_to').value}`); toast('Delegation saved and logged'); };

/* ================= CONNECTED SYSTEMS ================= */
VIEWS.systems = () => page({crumb:'Administration', title:'Connected systems', sub:'How the HR system shares data with PlusSave\'s other systems so nobody types the same thing twice.',
  body:`<div class="note"><b>One employee record, many systems.</b> When the MD approves a new hire, the HR system asks core banking and PlusPay to create the user. When an exit is approved, it disables both on the last working day. Payroll pulls staff loan instalments from core banking and posts net pay back.</div>
  <div class="grid g3">${SYSTEMS.map(s => `<div class="sysbox"><div class="hd"><span>${esc(s.name)}</span>${s.state === 'ok' ? pill('Connected', 'ok') : pill('File export', 'warn')}</div><ul>${s.flows.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>`).join('')}</div>`});

/* ================= AUDIT ================= */
VIEWS.audit = () => { const f = S.auditRole || '';
  return page({crumb:'Administration', title:'Audit trail', sub:'Read-only log of every action. Nobody can edit or delete entries, including system admins.',
    body:`<div class="toolbar"><select data-change="auditRole" aria-label="Filter by role"><option value="">All roles</option>${['staff','hr','md'].map(r => `<option value="${r}" ${r === f ? 'selected' : ''}>${ROLE_NAME[r]}</option>`).join('')}</select></div>`
      + table([{h:'Time', f:a => DT(a.at)}, {h:'User', f:a => person(emp(a.by), ROLE_NAME[a.role])}, {h:'Action', f:a => `<b>${esc(a.action)}</b>`}, {h:'Reference', f:a => `<span class="mono">${esc(a.ref)}</span>`}, {h:'Detail', f:a => esc(a.detail)}], AUDIT.filter(a => !f || a.role === f))}); };
A.auditRole = el => { S.auditRole = el.value; render(); };

/* ================= LOGOS AND BRANDING ================= */
VIEWS.brand = () => page({crumb:'Administration', title:'Logos and branding', sub:'The PlusSave Financial Solutions logo heads every menu. Upload the official file to replace the placeholder.',
  body:`<div class="grid">${[['ps','PlusSave Financial Solutions']].map(([k, l]) => card(l + ' logo', `<div style="display:flex;flex-direction:column;gap:12px">${S.logos[k] ? `<img src="${S.logos[k]}" alt="${l}" style="max-height:80px;width:auto;align-self:flex-start">` : `<div class="note warn">Showing the placeholder mark. Upload a PNG or SVG with a transparent background.</div>`}
    <div class="actions"><label class="btn primary" for="lg_${k}">Upload logo</label><input type="file" id="lg_${k}" accept="image/*" hidden data-change="logoUp" data-k="${k}">${S.logos[k] ? `<button class="btn" data-act="logoReset" data-k="${k}">Use placeholder</button>` : ''}</div></div>`)).join('')}</div>
    ${card('Preview', logos())}<div class="note">In this prototype, uploaded logos last for this session. In the live system they are stored in settings and also printed on payslips, letters and reports.</div>`});
A.logoUp = el => { const f = el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { S.logos[el.dataset.k] = r.result; render(); toast('Logo updated on every menu'); }; r.readAsDataURL(f); };
A.logoReset = el => { S.logos[el.dataset.k] = null; render(); };

/* ================= STAFF SELF-SERVICE ================= */
VIEWS.home = () => {
  const e = me(), mine = REQS.filter(r => r.maker === e.id), ret = mine.filter(r => r.status === 'returned'), l = payLine(e, PAY.inputs, PAY.period);
  const trains = TRAININGS.filter(t => t.status === 'Scheduled' && (t.audience === 'All staff' || t.audience.includes(e.dept)));
  const body = `${ret.map(r => `<div class="note warn"><b>${r.id} needs your attention.</b> ${esc(r.hist[r.hist.length - 1].c)} <button class="linkbtn" data-act="open" data-id="${r.id}">Fix and resubmit</button></div>`).join('')}
  <div class="kpis">
    <button class="kpi" data-go="myleave"><span class="l">Annual leave left</span><span class="v">${e.bal.Annual}</span><span class="d">of 21 days</span></button>
    <button class="kpi" data-go="myrequests"><span class="l">Requests in progress</span><span class="v">${mine.filter(r => r.status === 'pending').length}</span><span class="d">${ret.length} returned to you</span></button>
    <button class="kpi" data-go="payslips"><span class="l">October net pay</span><span class="v" style="font-size:22px">${UGX(l.net)}</span><span class="d">${PAY.status === 'Posted' ? 'Paid' : 'Pending approval'}</span></button>
    <button class="kpi" data-go="mytraining"><span class="l">Trainings due</span><span class="v">${trains.length}</span><span class="d">${trains.some(t => t.mandatory) ? '1 mandatory' : 'Optional'}</span></button>
  </div>
  <div class="grid g2">${card('Quick actions', `<div class="toolbar"><button class="btn primary" data-act="applyLeave">Apply for leave</button><button class="btn" data-act="detailsChange">Update my details</button><button class="btn" data-act="attFix">Fix a missed clock-in</button><button class="btn" data-act="trainReq">Request training</button><button class="btn" data-act="newGriev">Raise a grievance</button></div>`)}
    ${card('Notices', `<div class="list">${myNotes().slice(0, 4).map(n => `<div class="li"><div class="grow"><div class="t" style="font-weight:500">${esc(n.text)}</div><div class="s">${DT(n.at)}</div></div></div>`).join('')}</div>`)}</div>
  ${card('My recent requests', table([{h:'Ref', f:r => r.id}, {h:'Request', f:r => `<b>${esc(r.type)}</b><div class="muted" style="font-size:12px">${esc(r.subject)}</div>`}, {h:'Stage', f:r => reqStatus(r)}], mine.slice(0, 5), {click:r => `data-act="open" data-id="${r.id}"`, empty:'No requests yet.'}))}`;
  return page({crumb:'My workspace', title:`Good afternoon, ${e.fn}`, sub:`${esc(e.title)} · ${esc(e.branch)} · supervisor ${esc(nm(emp(e.sup)))}`, body});
};
VIEWS.myrequests = () => page({crumb:'My workspace', title:'My requests', sub:'Track each request through HR and the MD.', body:table([{h:'Ref', f:r => `<span class="mono">${r.id}</span>`}, {h:'Request', f:r => `<b>${esc(r.type)}</b><div class="muted" style="font-size:12px">${esc(r.subject)}</div>`}, {h:'Raised', f:r => DT(r.created)}, {h:'Stage', f:r => reqStatus(r)}], REQS.filter(r => r.maker === USERS.staff.emp), {click:r => `data-act="open" data-id="${r.id}"`, empty:'No requests yet.'})});
VIEWS.payslips = () => { const e = me(); return page({crumb:'Pay and time', title:'My payslips', sub:'Payslips are released after the MD approves payroll and it is posted to your account.', body:payslipHtml(e) + table([{h:'Period', f:p => p.period}, {h:'Status', f:p => pill(p.status, 'ok')}], [...PAYROLL_HIST].reverse())}); };
VIEWS.myattendance = () => { const e = me(), a = ATT[e.id];
  return page({crumb:'Pay and time', title:'My attendance', sub:`Shift starts ${SHIFT_START}.`, actions:'<button class="btn primary" data-act="attFix">Fix a missed clock-in</button>',
    body:`<div class="kpis"><div class="kpi" style="cursor:default"><span class="l">Today</span><span class="v">${a ? a[0] : '-'}</span><span class="d">${a ? esc(a[2]) : 'Not clocked in'}</span></div><div class="kpi" style="cursor:default"><span class="l">Days present (Oct)</span><span class="v">20</span><span class="d">of 21 working days</span></div><div class="kpi" style="cursor:default"><span class="l">Late arrivals (Oct)</span><span class="v">1</span><span class="d">After ${SHIFT_START}</span></div></div>`}); };
A.attFix = () => { const e = me(); formModal({title:'Attendance correction', flow:['staff','hr','md'], fields:[{id:'date', label:'Date', type:'date', val:'2026-10-27'}, {id:'time', label:'Actual time in', type:'time', val:'07:55', req:1}, {id:'reason', label:'Reason', type:'textarea', full:1, req:1, val:'Biometric device at Old Taxi Park was offline in the morning.'}],
  onSubmit:v => { if (!v.reason) return formError('Give a reason.'), false; newReq({type:'Attendance correction', subject:`${D(v.date)}: clock-in ${v.time}`, maker:e.id, note:v.reason, fields:[['Date', D(v.date)], ['Time in', v.time], ['Reason', v.reason]], payload:{emp:e.id, time:v.time}}); toast('Sent to HR'); }}); };
VIEWS.mytraining = () => { const e = me(); return page({crumb:'Growth and support', title:'My trainings', sub:'Trainings you attended and those coming up.', actions:'<button class="btn primary" data-act="trainReq">Request training</button>',
  body:table([{h:'Training', f:t => esc(t.title)}, {h:'Date', f:t => D(t.date)}, {h:'Status', f:t => t.done.includes(e.id) ? pill('Attended', 'ok') : pill(t.status === 'Completed' ? 'Missed' : 'Upcoming', t.status === 'Completed' ? 'plain' : 'gold')}, {h:'Mandatory', f:t => t.mandatory ? pill('Yes', 'warn') : 'No'}], TRAININGS.filter(t => t.done.includes(e.id) || t.audience === 'All staff' || t.audience.includes(e.dept)))}); };
A.trainReq = () => { const e = me(); formModal({title:'Request training', flow:['staff','hr','md'], fields:[{id:'title', label:'Course', req:1, full:1}, {id:'prov', label:'Provider'}, {id:'date', label:'Preferred date', type:'date'}, {id:'cost', label:'Cost (UGX)', type:'number'}, {id:'why', label:'How it helps your work', type:'textarea', full:1, req:1}],
  onSubmit:v => { if (!v.title || !v.why) return formError('Enter the course and how it helps.'), false; newReq({type:'Training request', subject:v.title, maker:e.id, note:v.why, fields:[['Course', v.title], ['Provider', v.prov || '-'], ['Date', D(v.date)], ['Cost', v.cost ? UGX(v.cost) : '-']], payload:{emp:e.id, title:v.title, provider:v.prov || '-', date:v.date || ISO(TODAY)}}); toast('Sent to HR'); }}); };
A.detailsChange = () => { const e = me(); const map = {phone:['Phone', e.phone], email:['Email', e.email], addr:['Address', e.addr], 'nok.n':['Next of kin name', e.nok.n], 'nok.p':['Next of kin contact', e.nok.p]};
  formModal({title:'Request a change to my details', flow:['staff','hr','md'], fields:[{id:'field', label:'What to change', type:'select', opts:Object.entries(map).map(([k, v]) => [k, v[0]]), full:1}, {id:'val', label:'New value', req:1, full:1}, {id:'doc', label:'Supporting document', type:'file', full:1}, {type:'calc'}],
    onInput:v => { $('#calc').innerHTML = `Current value: <b>${esc(map[v.field][1])}</b>`; },
    onSubmit:v => { if (!v.val) return formError('Enter the new value.'), false; newReq({type:'Personal details change', subject:`${map[v.field][0]} change`, maker:e.id, fields:[['Field', map[v.field][0]], ['Current value', map[v.field][1]], ['New value', v.val], ['Supporting document', v.doc || 'None']], payload:{emp:e.id, field:v.field, value:v.val}}); toast('Sent to HR'); }}); };
EFFECTS['Personal details change'] = r => { const e = emp(r.payload.emp), f = r.payload.field; if (f.startsWith('nok.')) e.nok[f.slice(4)] = r.payload.value; else e[f] = r.payload.value; };

/* ================= START ================= */
$('#bell').addEventListener('click', A.bell);
$('#burger').addEventListener('click', () => $('#side').classList.toggle('open'));
$('#q').addEventListener('input', e => { S.q = e.target.value; if (S.role === 'staff') return; if (S.view !== 'employees') go('employees'); else render(); });
render();
</script>
</body>
</html>
