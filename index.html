<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlusSave HR System</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main menu"></aside>
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Open menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <label class="search" for="q"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search staff by name, ID, title or branch" autocomplete="off"></label>
      <span class="seg-label">Signed in as</span>
      <div class="seg" id="roleseg" role="tablist" aria-label="Demo role">
        <button data-role="staff">Staff</button><button data-role="hr">HR</button><button data-role="md">MD</button>
      </div>
      <button class="iconbtn" id="bell" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="dot" id="belldot" hidden>0</span></button>
      <div class="me" id="me"></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="scrim" id="drawerScrim" hidden><div class="drawer" id="drawer" role="dialog" aria-modal="true"></div></div>
<div class="scrim center" id="modalScrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="js/01-sample-data.js"></script>
<script src="js/02-core-payroll-and-approvals.js"></script>
<script src="js/03-layout-nav-forms.js"></script>
<script src="js/04-dashboard-people-leave.js"></script>
<script src="js/05-talent-movements-payroll.js"></script>
<script src="js/06-gratuity-cases-exits.js"></script>
<script src="js/07-library-reports-admin-staff.js"></script>
</body>
</html>
